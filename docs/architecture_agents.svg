<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 840" width="1120" height="840" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .title  { font-size: 21px; font-weight: 700; fill: #0d1b1e; }
    .sub    { font-size: 11px; fill: #4d6066; }
    .colh   { font-size: 10px; font-weight: 700; fill: #0f4c5c; letter-spacing: 0.4px; }
    .name   { font-size: 12.5px; font-weight: 600; fill: #1a2327; }
    .trig   { font-size: 9px; fill: #00695c; font-weight: 600; }
    .cell   { font-size: 9.5px; fill: #37474f; }
    .cellm  { font-size: 9.5px; fill: #6a1b9a; }
    .cellg  { font-size: 9.5px; fill: #78909c; font-style: italic; }
    .sect   { font-size: 11px; font-weight: 700; fill: #0f4c5c; letter-spacing: 0.5px; }
    .rule   { stroke: #d6dfe2; stroke-width: 1; }
    .rulet  { stroke: #b6c4c9; stroke-width: 1.6; }
  </style>

  <rect width="1120" height="840" fill="#fbfcfc"/>
  <text x="30" y="40" class="title">Agent &amp; Tool Detail</text>
  <text x="30" y="62" class="sub">Diagram 2 of 2 · every agent, the tools it can call, and the data source each tool touches. Flow and handoffs are in the System Flow diagram.</text>

  <rect x="30" y="80" width="1060" height="30" fill="#e8eef0"/>
  <text x="42" y="100" class="colh">COMPONENT</text>
  <text x="196" y="100" class="colh">READS FROM</text>
  <text x="352" y="100" class="colh">TOOLS  &#8594;  DATA SOURCE EACH ONE TOUCHES</text>
  <text x="792" y="100" class="colh">EMITS</text>
  <line x1="30" y1="110" x2="1090" y2="110" class="rulet"/>
  <rect x="30" y="110" width="1060" height="22" fill="#f2f6f7"/>
  <text x="42" y="126" class="sect">LAYER 1 — PERCEPTION SWARM · parallel, independent, disjoint source systems</text>
  <line x1="30" y1="132" x2="1090" y2="132" class="rule"/>
  <text x="42" y="152" class="name">Transaction Agent</text>
  <text x="42" y="167" class="trig">on_event + on_tick</text>
  <text x="42" y="182" class="cellg">agents/transaction.py</text>
  <text x="196" y="152" class="cell">card_payments</text>
  <text x="196" y="166" class="cell">core_banking_ledger</text>
  <text x="196" y="180" class="cell">instant_payments</text>
  <text x="196" y="194" class="cell">ach_wire</text>
  <text x="196" y="208" class="cell">trading_brokerage</text>
  <text x="352" y="152" class="cell">memory.events_as_of(as_of, ...)  →  episodic (SQLite)</text>
  <text x="352" y="166" class="cell">memory.daily_rate(as_of, ...)  →  episodic (SQLite)</text>
  <text x="352" y="180" class="cell">memory.baseline_daily_rate(as_of, ...)  →  episodic (SQLite)</text>
  <text x="352" y="194" class="cell">redactor.counterparty_is_customer  →  the event payload</text>
  <text x="352" y="208" class="cellg">no model: every detection here is arithmetic</text>
  <text x="792" y="152" class="cell">14 signals, including:</text>
  <text x="792" y="166" class="cell">income_disruption · savings_drawdown</text>
  <text x="792" y="180" class="cell">salary_swept_out · card_spend_collapse</text>
  <text x="792" y="194" class="cell">baby_retail_spend · unusual_refund</text>
  <line x1="30" y1="220" x2="1090" y2="220" class="rule"/>
  <rect x="30" y="220" width="1060" height="74" fill="#f7fafb"/>
  <text x="42" y="240" class="name">Usage Agent</text>
  <text x="42" y="255" class="trig">on_event + on_tick</text>
  <text x="42" y="270" class="cellg">agents/usage.py</text>
  <text x="196" y="240" class="cell">web_app_events</text>
  <text x="352" y="240" class="cell">memory.daily_rate(as_of, ...)  →  episodic (SQLite)</text>
  <text x="352" y="254" class="cell">memory.baseline_daily_rate(as_of, ...)  →  episodic (SQLite)</text>
  <text x="352" y="268" class="cell">redactor.scrub  →  search_text in the payload</text>
  <text x="352" y="282" class="cellm">llm.complete_json  →  prompts.SEARCH_INTENT</text>
  <text x="792" y="240" class="cell">cancellation_feature_used</text>
  <text x="792" y="254" class="cell">engagement_drop · search_intent</text>
  <text x="792" y="268" class="cell">session_length_collapse</text>
  <line x1="30" y1="294" x2="1090" y2="294" class="rule"/>
  <text x="42" y="314" class="name">Support Agent</text>
  <text x="42" y="329" class="trig">on_event</text>
  <text x="42" y="344" class="cellg">agents/support.py</text>
  <text x="196" y="314" class="cell">support_logs</text>
  <text x="352" y="314" class="cell">payload.resolution_status  →  support_logs</text>
  <text x="352" y="328" class="cell">redactor.scrub  →  ticket raw_text</text>
  <text x="352" y="342" class="cellm">llm.complete_json  →  prompts.TICKET_THEME</text>
  <text x="792" y="314" class="cell">complaint_denied · complaint_open</text>
  <text x="792" y="328" class="cell">hardship_contact · reassurance_contact</text>
  <line x1="30" y1="354" x2="1090" y2="354" class="rule"/>
  <rect x="30" y="354" width="1060" height="60" fill="#f7fafb"/>
  <text x="42" y="374" class="name">Life-Signal Agent</text>
  <text x="42" y="389" class="trig">on_event</text>
  <text x="42" y="404" class="cellg">agents/life_signal.py</text>
  <text x="196" y="374" class="cell">loan_kyc</text>
  <text x="196" y="388" class="cell">social_signal_consented</text>
  <text x="352" y="374" class="cell">payload.consent_flag gate  →  social_signal_consented</text>
  <text x="352" y="388" class="cell">redactor.scrub  →  post raw_text</text>
  <text x="352" y="402" class="cellm">llm.complete_json  →  prompts.SOCIAL_LIFE_EVENT</text>
  <text x="792" y="374" class="cell">dependents_increase · address_change</text>
  <text x="792" y="388" class="cell">marital_status_change · loan_application</text>
  <text x="792" y="402" class="cell">social_life_event</text>
  <line x1="30" y1="414" x2="1090" y2="414" class="rule"/>
  <rect x="30" y="414" width="1060" height="22" fill="#f2f6f7"/>
  <text x="42" y="430" class="sect">LAYER 2 &amp; 3 — CORRELATION AND DECISION · reached only on the daily cycle, never on the event path</text>
  <line x1="30" y1="436" x2="1090" y2="436" class="rule"/>
  <text x="42" y="456" class="name">Synthesis Agent</text>
  <text x="42" y="471" class="cellg">synthesis.py</text>
  <text x="196" y="456" class="cell">the state board —</text>
  <text x="196" y="470" class="cell">findings only, never</text>
  <text x="196" y="484" class="cell">raw events</text>
  <text x="352" y="456" class="cell">board.corroboration(as_of)  →  episodic findings</text>
  <text x="352" y="470" class="cell">board.current_state(as_of)  →  episodic decisions</text>
  <text x="352" y="484" class="cellm">llm.complete_json  →  prompts.SYNTHESIS</text>
  <text x="792" y="456" class="cell">inferred_state · confidence_band</text>
  <text x="792" y="470" class="cell">rationale · event_ids · affinity</text>
  <line x1="30" y1="496" x2="1090" y2="496" class="rule"/>
  <rect x="30" y="496" width="1060" height="60" fill="#f7fafb"/>
  <text x="42" y="516" class="name">Action Proposer</text>
  <text x="42" y="531" class="cellg">action.py</text>
  <text x="196" y="516" class="cell">the Synthesis result</text>
  <text x="196" y="530" class="cell">(never raw events)</text>
  <text x="352" y="516" class="cell">semantic.retrieve_policies(query, k=4)  →  ChromaDB</text>
  <text x="352" y="530" class="cell">memory.decisions_as_of(as_of)  →  episodic decisions</text>
  <text x="352" y="544" class="cellm">llm.complete_json  →  prompts.PROPOSER</text>
  <text x="792" y="516" class="cell">action · action_subtype</text>
  <text x="792" y="530" class="cell">policy_ids · gate_reason · decided_by</text>
  <line x1="30" y1="556" x2="1090" y2="556" class="rule"/>
  <text x="42" y="576" class="name">Guardrail</text>
  <text x="42" y="591" class="cellg">guardrail.py · code only</text>
  <text x="196" y="576" class="cell">the proposal and its</text>
  <text x="196" y="590" class="cell">Corroboration record</text>
  <text x="352" y="576" class="cell">NONE — set membership and len(), nothing else</text>
  <text x="352" y="590" class="cell">≥ 2 independent source_systems AND ≥ 2 distinct events</text>
  <text x="792" y="576" class="cell">passed · reason · checks</text>
  <text x="792" y="590" class="cell">independent_sources · event_ids</text>
  <line x1="30" y1="602" x2="1090" y2="602" class="rule"/>
  <rect x="30" y="602" width="1060" height="60" fill="#f7fafb"/>
  <text x="42" y="622" class="name">Critique Agent</text>
  <text x="42" y="637" class="cellg">critique.py</text>
  <text x="196" y="622" class="cell">the proposal, the</text>
  <text x="196" y="636" class="cell">diagnosis and the</text>
  <text x="196" y="650" class="cell">guardrail verdict</text>
  <text x="352" y="622" class="cell">4 checks in code: corroborated · policy-backed ·</text>
  <text x="352" y="636" class="cell">no contradiction · ≥ 2 distinct events</text>
  <text x="352" y="650" class="cellm">llm.complete_json  →  prompts.CRITIC</text>
  <text x="792" y="622" class="cell">verdict: accept | downgrade | reject</text>
  <text x="792" y="636" class="cell">reason · revised_action</text>
  <line x1="30" y1="662" x2="1090" y2="662" class="rule"/>
  <text x="42" y="682" class="name">HITL checkpoint</text>
  <text x="42" y="697" class="cellg">critique.py · HitlStub</text>
  <text x="196" y="682" class="cell">the final action and</text>
  <text x="196" y="696" class="cell">its reasoning trace</text>
  <text x="352" y="682" class="cell">a CLI prompt to a human — approve / reject / modify</text>
  <text x="352" y="696" class="cellg">a rejection becomes no_action in the graded output</text>
  <text x="792" y="682" class="cell">hitl_status · action</text>
  <text x="792" y="696" class="cell">action_subtype · note</text>
  <line x1="30" y1="708" x2="1090" y2="708" class="rule"/>
  <rect x="30" y="708" width="1060" height="46" fill="#f7fafb"/>
  <text x="42" y="728" class="name">Review queue</text>
  <text x="42" y="743" class="cellg">review.py</text>
  <text x="196" y="728" class="cell">the Synthesis result</text>
  <text x="196" y="742" class="cell">and the final proposal</text>
  <text x="352" y="728" class="cell">NONE — comparison and set arithmetic, no model</text>
  <text x="352" y="742" class="cellg">writes review_queue.json, never the graded file</text>
  <text x="792" y="728" class="cell">reason: weak_but_corroborated | contested</text>
  <text x="792" y="742" class="cell">inferred_state · source_systems · citations</text>
  <line x1="30" y1="754" x2="1090" y2="754" class="rulet"/>

  <text x="30" y="780" class="sub">Every model call above has a deterministic fallback the test suite exercises: C360_OFFLINE=1 runs the whole system, end to end, with no API access.</text>
  <text x="30" y="798" class="sub">Every prompt named here lives in one file, src/c360/prompts.py. Every tool's as_of argument is mandatory and has no default, so a caller cannot omit the time filter.</text>
  <text x="30" y="816" class="sub">Prompt text, JSON shapes and the full signal vocabularies are in docs/AGENTS.md.</text>
</svg>
